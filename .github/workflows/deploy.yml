name: Déployer BYYND sur Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests de sécurité du Worker
        run: node --test worker/test/auth.test.mjs
      - name: Installer wrangler
        run: npm install -g wrangler@4
      - name: Vérifier les secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Ajoute CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID dans Settings → Secrets and variables → Actions"; exit 1; fi
      - name: Base D1 (création si absente)
        run: |
          ID=$(wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);const x=a.find(d=>d.name==="byynd");console.log(x?x.uuid:"")})')
          if [ -z "$ID" ]; then
            wrangler d1 create byynd > /dev/null
            ID=$(wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);const x=a.find(d=>d.name==="byynd");console.log(x?x.uuid:"")})')
          fi
          echo "D1: $ID"
          sed -i "s/D1_PLACEHOLDER/$ID/" wrangler.toml
          wrangler d1 execute byynd --remote --file=worker/schema.sql
      - name: Sous-domaine workers.dev (création si absent)
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          CUR=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(j.success&&j.result&&j.result.subdomain||"")}catch(e){console.log("")}})')
          if [ -z "$CUR" ]; then
            for NAME in emilyguindi byynd-emily byynd-eg-2026; do
              R=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "{\"subdomain\":\"$NAME\"}" "$API")
              if echo "$R" | grep -q '"success":true'; then CUR=$NAME; break; fi
              echo "Essai $NAME : $R"
            done
          fi
          if [ -z "$CUR" ]; then echo "::error title=Sous-domaine::Impossible de créer le sous-domaine workers.dev automatiquement"; exit 1; fi
          echo "::notice title=Sous-domaine::$CUR.workers.dev"
      - name: Déployer le Worker
        run: |
          set -o pipefail
          wrangler deploy 2>&1 | tee /tmp/deploy.log || { echo "::error title=wrangler deploy::$(tail -c 900 /tmp/deploy.log | tr '\n' ' ')"; exit 1; }
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          echo "::notice title=Adresse BYYND::$URL"
      - name: Secrets du Worker (clé, Strava, Google)
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_VERIFY_TOKEN: ${{ secrets.STRAVA_VERIFY_TOKEN }}
        run: |
          for K in APP_KEY STRAVA_CLIENT_ID STRAVA_CLIENT_SECRET STRAVA_VERIFY_TOKEN GOOGLE_WEB_CLIENT_ID ALLOWED_EMAILS; do
            V="${!K}"; if [ -n "$V" ]; then printf '%s' "$V" | wrangler secret put "$K" > /dev/null && echo "$K ok (${#V} caractères)"; else echo "::warning::$K absent"; fi
          done
      - name: Abonnement webhook Strava (création si absent)
        env:
          CID: ${{ secrets.STRAVA_CLIENT_ID }}
          CSEC: ${{ secrets.STRAVA_CLIENT_SECRET }}
          VTOK: ${{ secrets.STRAVA_VERIFY_TOKEN }}
        run: |
          if [ -z "$CID" ] || [ -z "$CSEC" ] || [ -z "$VTOK" ]; then echo "Strava pas encore configuré"; exit 0; fi
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          sleep 10
          EXIST=$(curl -s -G https://www.strava.com/api/v3/push_subscriptions -d client_id=$CID -d client_secret=$CSEC)
          if echo "$EXIST" | grep -q '"id"'; then echo "::notice title=Webhook Strava::déjà actif"; exit 0; fi
          R=$(curl -s -X POST https://www.strava.com/api/v3/push_subscriptions -F client_id=$CID -F client_secret=$CSEC -F callback_url=$URL/strava/webhook -F verify_token=$VTOK)
          if echo "$R" | grep -q '"id"'; then echo "::notice title=Webhook Strava::créé"; else echo "::warning title=Webhook Strava::$(echo $R | head -c 600)"; fi
