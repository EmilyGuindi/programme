name: Diagnostic données
on:
  push:
    branches: [main]
    paths: ['diag/**']
jobs:
  d:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g wrangler@4 > /dev/null
      - name: ID base
        run: |
          ID=$(wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);const x=a.find(d=>d.name==="byynd");console.log(x?x.uuid:"")})')
          sed -i "s/D1_PLACEHOLDER/$ID/" wrangler.toml
      - name: Requêtes
        shell: bash {0}
        run: |
          q(){ wrangler d1 execute byynd --remote --json --command "$2" > /tmp/o.txt 2>&1; R=$(tr '\n' ' ' < /tmp/o.txt | tr -s ' ' | tail -c 900); echo "::warning title=$1::${R:-vide}"; }
          q "Recentes" "SELECT json_extract(json,'$.date') AS d, json_extract(json,'$.sportType') AS t, json_extract(json,'$.calories') AS kcal, updated_at FROM strava_activities WHERE json_extract(json,'$.date') >= '2026-10-01' ORDER BY json_extract(json,'$.date') DESC LIMIT 10"
          q "Etat app activites" "SELECT (length(json)-length(replace(json,'\"stravaId\"','')))/10 AS strava_acts, (length(json)-length(replace(json,'\"calories\":','')))/11 AS avec_cal, json_extract(json,'$.strava.since') AS since FROM state"
          q "Max update" "SELECT max(updated_at) AS maxu, min(updated_at) AS minu FROM strava_activities"
