name: Diagnostic Strava
on:
  push:
    branches: [main]
    paths: ['diag/**']
jobs:
  d:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CID: ${{ secrets.STRAVA_CLIENT_ID }}
      CSEC: ${{ secrets.STRAVA_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g wrangler@4 > /dev/null
      - name: Activités du 16 au 18 octobre
        shell: bash {0}
        run: |
          ID=$(wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);console.log(a.find(d=>d.name==="byynd").uuid)})')
          sed -i "s/D1_PLACEHOLDER/$ID/" wrangler.toml
          REFRESH=$(wrangler d1 execute byynd --remote --json --command "SELECT json_extract(json,'$.refresh') AS r FROM integrations WHERE name='strava'" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{console.log(JSON.parse(s)[0].results[0].r)})')
          TOK=$(curl -s -X POST https://www.strava.com/oauth/token -d client_id=$CID -d client_secret=$CSEC -d grant_type=refresh_token -d refresh_token=$REFRESH | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s);console.log(j.access_token||"");require("fs").writeFileSync("/tmp/newref",j.refresh_token||"");require("fs").writeFileSync("/tmp/exp",String(j.expires_at||""))})')
          NR=$(cat /tmp/newref); EXP=$(cat /tmp/exp)
          if [ -n "$NR" ]; then wrangler d1 execute byynd --remote --command "UPDATE integrations SET json=json_set(json,'$.access','$TOK','$.refresh','$NR','$.expiresAt',$EXP) WHERE name='strava'" > /dev/null; fi
          AFTER=$(date -d 2026-10-16 +%s); BEFORE=$(date -d 2026-10-19 +%s)
          curl -s -H "Authorization: Bearer $TOK" "https://www.strava.com/api/v3/athlete/activities?after=$AFTER&before=$BEFORE&per_page=20" > /tmp/list.json
          for A in $(node -e 'JSON.parse(require("fs").readFileSync("/tmp/list.json","utf8")).forEach(a=>console.log(a.id))'); do
            curl -s -H "Authorization: Bearer $TOK" "https://www.strava.com/api/v3/activities/$A" > /tmp/a.json
            R=$(node -e 'const a=JSON.parse(require("fs").readFileSync("/tmp/a.json","utf8"));console.log(JSON.stringify({id:a.id,name:a.name,type:a.sport_type,start:a.start_date_local,dist:a.distance,moving:a.moving_time,elapsed:a.elapsed_time,elev:a.total_elevation_gain,hr:a.average_heartrate,maxhr:a.max_heartrate,kcal:a.calories,rpe:a.perceived_exertion,desc:a.description,device:a.device_name}))')
            echo "::warning title=Activité $A::$R"
          done
