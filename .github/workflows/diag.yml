name: Diagnostic EAS
on:
  push:
    branches: [main]
    paths: ['diag/**']
jobs:
  diag:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund > /dev/null
      - run: npx --yes eas-cli@latest init --non-interactive --force || true
      - name: Infos
        shell: bash {0}
        run: |
          note(){ echo "::notice title=$1::$(echo "$2" | tr '\n' ' ' | head -c 3000)"; }
          note "channel preview" "$(npx --yes eas-cli@latest channel:view preview --json --non-interactive 2>&1 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const c=j.currentPage||j;console.log(JSON.stringify({name:c.name,branchMapping:c.branchMapping,branches:(c.updateBranches||[]).map(b=>({name:b.name,updates:(b.updateGroups||[]).slice(0,3).map(g=>g.map(u=>({rt:u.runtimeVersion,platform:u.platform,msg:u.message,created:u.createdAt})))}))}))}catch(e){console.log(s.slice(0,1500))}})')"
          note "updates" "$(npx --yes eas-cli@latest update:list --branch preview --limit 5 --json --non-interactive 2>&1 | head -c 2500)"
          note "builds" "$(npx --yes eas-cli@latest build:list --platform android --limit 3 --json --non-interactive 2>&1 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.stringify(JSON.parse(s).map(b=>({v:b.appVersion,rt:b.runtimeVersion,ch:b.channel,st:b.status,created:b.createdAt}))))}catch(e){console.log(s.slice(0,1500))}})')"
          note "app.json updates" "$(node -e 'const a=require("./app.json").expo;console.log(JSON.stringify({updates:a.updates,rt:a.runtimeVersion,eas:a.extra&&a.extra.eas}))')"
