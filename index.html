<style>
/* ===== Design tokens ===== */
:root{
  --paper:#F4F2EE; --surface:#FFFFFF; --surface-2:#ECE9E3; --ink:#15161A; --ink-2:#6B6E76; --line:#E3E0DA; --line-2:#D3CFC7;
  --accent:#2946F0; --accent-ink:#FFFFFF; --accent-soft:#E6EAFE;
  --ok:#1F8A5B; --warn:#C7791A; --stop:#C23B4C; --ok-soft:#E3F3EA; --warn-soft:#FAEEDD; --stop-soft:#F8E3E6;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r1:8px; --r2:14px; --r3:999px;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fs-12:12px; --fs-14:14px; --fs-16:16px; --fs-18:18px; --fs-22:22px; --fs-28:28px; --fs-40:40px; --fs-64:64px;
  --ease:160ms ease-out;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#121316; --surface:#1B1D22; --surface-2:#23262C; --ink:#F2F1ED; --ink-2:#A3A6AE; --line:#2C2F36; --line-2:#3A3E47;
  --accent:#7B8CFF; --accent-ink:#0F1120; --accent-soft:#242A4A;
  --ok:#4CC27D; --warn:#E9A23B; --stop:#F06478; --ok-soft:#1B2E24; --warn-soft:#33271A; --stop-soft:#36202A; } }
:root[data-theme="dark"]{ --paper:#121316; --surface:#1B1D22; --surface-2:#23262C; --ink:#F2F1ED; --ink-2:#A3A6AE; --line:#2C2F36; --line-2:#3A3E47; --accent:#7B8CFF; --accent-ink:#0F1120; --accent-soft:#242A4A; --ok:#4CC27D; --warn:#E9A23B; --stop:#F06478; --ok-soft:#1B2E24; --warn-soft:#33271A; --stop-soft:#36202A; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:var(--fs-16);line-height:1.45;-webkit-font-smoothing:antialiased;font-variation-settings:"wdth" 100}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.2;font-weight:600}
h1{font-size:var(--fs-28)} h2{font-size:var(--fs-22)} h3{font-size:var(--fs-18)}
p{margin:0 0 var(--s3)}
.muted{color:var(--ink-2)} .small{font-size:var(--fs-14)} .tiny{font-size:var(--fs-12)}
.num{font-variant-numeric:tabular-nums}
.hero{font-variation-settings:"wdth" 75;font-weight:600;font-size:var(--fs-64);line-height:.95;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.hero-m{font-variation-settings:"wdth" 78;font-weight:600;font-size:var(--fs-40);line-height:1;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding:0 var(--s4) 110px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:var(--s4) 0 var(--s3)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.08em;font-size:var(--fs-14)}
.brand svg{width:28px;height:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s4);margin-bottom:var(--s3)}
.card.flat{background:transparent;border-style:dashed}
.card.accent{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.card.accent .muted{color:color-mix(in srgb,var(--paper) 70%,transparent)}
.row{display:flex;align-items:center;gap:var(--s3)} .row.between{justify-content:space-between} .row.top{align-items:flex-start}
.stack>*+*{margin-top:var(--s3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 var(--s5);border-radius:var(--r1);border:1px solid var(--line-2);background:var(--surface);font-weight:600;transition:transform var(--ease),background var(--ease)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{width:100%} .btn.sm{min-height:40px;padding:0 var(--s4);font-size:var(--fs-14)} .btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--stop)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:var(--r3);padding:4px 12px;font-size:var(--fs-14);font-weight:600;border:1px solid var(--line)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.vert{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.pill.orange{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.pill.rouge{color:var(--stop);background:var(--stop-soft);border-color:transparent}
.pill.inconnu{color:var(--ink-2);background:var(--surface-2);border-color:transparent}
.tag{display:inline-block;font-size:var(--fs-12);font-weight:600;color:var(--ink-2);border:1px solid var(--line);border-radius:var(--r3);padding:1px 8px;vertical-align:middle}
.seg{display:flex;background:var(--surface-2);border-radius:var(--r1);padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:6px;min-height:40px;padding:0 8px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:6px}
.choices button{min-height:48px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r1);font-weight:600;padding:0 6px}
.choices button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.choices.n11{grid-template-columns:repeat(11,1fr)} .choices.n11 button{min-height:44px;padding:0}
.field{margin-bottom:var(--s4)} .field>label,.field>.lab{display:block;font-weight:600;margin-bottom:6px}
.field .hint{font-weight:400;color:var(--ink-2);font-size:var(--fs-14)}
.input,textarea.input{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r1);padding:12px 14px;font-size:var(--fs-16);min-height:48px}
textarea.input{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.list{display:flex;flex-direction:column;gap:var(--s2)}
.item{display:grid;grid-template-columns:48px 1fr auto;gap:var(--s3);align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s3) var(--s4);min-height:72px}
.item .d{font-weight:600;line-height:1.1} .item .d small{display:block;font-weight:400;color:var(--ink-2);font-size:var(--fs-12)}
.item .t{font-weight:600} .item .s{color:var(--ink-2);font-size:var(--fs-14)}
.item.box{border-left:4px solid var(--ink)} .item.run{border-left:4px dashed var(--accent)} .item.renfo{border-left:4px double var(--ink-2)} .item.event{border-left:4px solid var(--accent);background:var(--accent-soft)} .item.rest{border-left:4px solid transparent}
.item.done .t::after{content:" ✓";color:var(--ok)}
.item.today{box-shadow:0 0 0 2px var(--accent)}
.tick{width:36px;height:36px;border-radius:50%;border:2px solid var(--line-2);background:transparent;display:grid;place-items:center;flex:none;color:transparent}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.tick svg{width:16px;height:16px}
details{border-top:1px solid var(--line);padding-top:var(--s2);margin-top:var(--s2)}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;min-height:32px;align-items:center}
summary::after{content:"+";color:var(--ink-2)} details[open] summary::after{content:"–"}
.sheet{position:fixed;inset:0;background:var(--paper);z-index:40;overflow-y:auto;transform:translateY(100%);transition:transform 220ms ease;padding-top:env(safe-area-inset-top,0px)}
.sheet.on{transform:none}
.sheet .wrap{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.sheethead{position:sticky;top:0;background:var(--paper);z-index:2;padding:var(--s4) 0 var(--s3);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:var(--s3)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:transparent;padding:10px 0 12px;font-weight:600;font-size:var(--fs-12);color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:4px;min-height:56px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"] svg{stroke:var(--accent)}
.step{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) 0;border-top:1px solid var(--line)} .step:first-child{border-top:0}
.step .pz{display:block;font-size:var(--fs-14);color:var(--accent);font-weight:600}
.stepper{display:flex;flex-direction:column;gap:var(--s4);text-align:center;padding:var(--s5) 0}
.stepper .cur{font-size:var(--fs-28);font-weight:600;line-height:1.2}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s4);margin-bottom:var(--s3)}
.ex.done{border-color:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.chip{font-size:var(--fs-14);font-weight:600;background:var(--surface-2);border-radius:var(--r3);padding:3px 10px}
.chip.hot{background:var(--accent-soft);color:var(--accent)}
.sets{display:grid;gap:6px} .set{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;align-items:center}
.set input{width:100%;min-width:0;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r1);padding:10px;font-size:var(--fs-16);min-height:44px}
.set .tick{width:44px;height:44px} .lbls{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:8px;font-size:var(--fs-12);color:var(--ink-2)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s3);margin:var(--s3) 0} .chart svg{width:100%;height:auto;display:block}
.stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--s3)} .stat>div{background:var(--surface-2);border-radius:var(--r1);padding:var(--s3)} .stat b{display:block;font-size:var(--fs-22);font-variation-settings:"wdth" 80;font-variant-numeric:tabular-nums} .stat span{font-size:var(--fs-12);color:var(--ink-2)}
.coach{border-left:4px solid var(--accent);padding:var(--s3) var(--s4);background:var(--surface);border-radius:4px var(--r2) var(--r2) 4px;margin-bottom:var(--s3)}
.empty{text-align:center;color:var(--ink-2);padding:var(--s5)}
.calrow{display:grid;grid-template-columns:36px repeat(7,1fr);gap:3px;align-items:center;font-size:var(--fs-12)}
.calrow .c{height:22px;border-radius:4px;background:var(--surface-2)} .c.p{background:var(--line-2)} .c.d{background:var(--ok)} .c.a{background:var(--warn)} .c.o{background:var(--accent-soft)} .c.e{background:var(--accent)} .c.m{background:var(--stop-soft)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:var(--fs-12);color:var(--ink-2);margin-top:8px} .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:var(--r3);font-weight:600;z-index:50;opacity:0;transition:opacity var(--ease);pointer-events:none}
.toast.on{opacity:1}
table{border-collapse:collapse;width:100%;font-size:var(--fs-14)} th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)} th{color:var(--ink-2);font-weight:600} td.num,th.num{text-align:right}
.tablewrap{overflow-x:auto}
.back{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r1);min-height:40px;padding:0 14px;font-weight:600}
.k{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)} .k:first-child{border-top:0}
.ok{color:var(--ok)} .warn{color:var(--warn)} .stop{color:var(--stop)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="wrap" id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<nav class="tabs"><div class="in" role="tablist">
  <button role="tab" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Aujourd'hui</button>
  <button role="tab" data-tab="program"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Programme</button>
  <button role="tab" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-6 4 3 4-7"/></svg>Progression</button>
  <button role="tab" data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profil</button>
</div></nav>
<script>
/* ================= BYYND — lot 1 ================= */
const VERSION = "1.1.0";
const LOGO = '<svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#15161A"/><path d="M13 46h14V31h14V16h12" fill="none" stroke="#F4F2EE" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="53" cy="16" r="5" fill="#2946F0"/></svg>';
const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

/* ---------- dates ---------- */
const DAYN = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const DAYS = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
const iso = d => { const z=new Date(d.getTime()-d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const parseISO = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d=parseISO(s); d.setDate(d.getDate()+n); return iso(d); };
const dow = s => (parseISO(s).getDay()+6)%7; // 0=Mon
const today = () => iso(new Date());
const fmtD = (s,opt) => parseISO(s).toLocaleDateString("fr-FR",opt||{weekday:"long",day:"numeric",month:"long"});
const fmtShort = s => parseISO(s).toLocaleDateString("fr-FR",{day:"numeric",month:"short"}).replace(".","");
const mmss = sec => { sec=Math.round(sec); return Math.floor(sec/60)+"'"+String(sec%60).padStart(2,"0"); };
const clock = sec => { sec=Math.round(sec); const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60; return (h?h+"h"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0"); };
const parseTime = t => { if(!t) return null; const p=String(t).trim().replace(/[h'’]/g,":").replace(/[^0-9:.]/g,"").split(":").map(Number); if(p.some(isNaN)||!p.length) return null; return p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:p[0]*60; };
const num = v => { if(v==null||v==="") return null; const n=+String(v).replace(",","."); return isNaN(n)?null:n; };
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid = () => Math.random().toString(36).slice(2,10);

/* ---------- store ---------- */
const KEY = "byynd-v1";
const DEFAULT = {
  v:1, updatedAt:0,
  user:{ name:"Emily", tz:"Europe/Paris", height:165, startDate:"2026-10-14",
    goals:{ weightTarget:60, run:"10 km à 5'30/km, effort maîtrisé", physique:"Épaules et bras dessinés, dos développé, taille marquée, abdos visibles, fessiers et quadriceps développés" },
    prefs:{ checkinTime:"07:00", weighDay:0, weighTime:"07:30", notifCheckin:true, notifWeigh:true, cycleOptIn:false },
    ref:{ k10:null, k5:null } },
  program:{ id:"c1", name:"Cycle 1 · Oct → Fév", start:"2026-10-12", weeks:20 },
  events:[], activities:[], checkins:{}, measurements:[], strength:{}, runs:{}, overrides:{}, adjustments:[], migrated:false,
  server:{ url:"", key:"" }
};
let S = JSON.parse(JSON.stringify(DEFAULT));
try{ const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw)); }catch(e){}
function save(){ S.updatedAt=Date.now(); try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} schedulePush(); }
/* ---------- sync serveur (lot 2) ---------- */
let syncState={status:"local",at:0,msg:""}, pushTimer=null;
function apiBase(){ if(/\.workers\.dev$/.test(location.hostname)) return ""; return (S.server&&S.server.url||"").replace(/\/$/,""); }
function apiKey(){ return S.server&&S.server.key||""; }
function syncReady(){ return !!apiKey()&&(apiBase()!==""||/\.workers\.dev$/.test(location.hostname)); }
function stateJson(){ const {server,...rest}=S; return JSON.stringify(rest); }
async function apiFetch(path,opt={}){ const r=await fetch(apiBase()+path,{...opt,headers:{"Authorization":"Bearer "+apiKey(),"Content-Type":"application/json",...(opt.headers||{})}}); return r; }
function schedulePush(){ if(!syncReady()) return; clearTimeout(pushTimer); pushTimer=setTimeout(pushState,1500); }
async function pushState(){ if(!syncReady()) return; try{ syncState.status="sync"; renderSyncBadge();
    const r=await apiFetch("/api/state",{method:"PUT",body:JSON.stringify({json:stateJson(),updatedAt:S.updatedAt})});
    if(r.status===409){ const d=await r.json(); adoptRemote(d); syncState={status:"ok",at:Date.now(),msg:"Version plus récente récupérée"}; render(); }
    else if(r.status===401){ syncState={status:"err",at:Date.now(),msg:"Clé refusée"}; }
    else if(r.ok){ syncState={status:"ok",at:Date.now(),msg:""}; }
    else syncState={status:"err",at:Date.now(),msg:"Erreur "+r.status};
  }catch(e){ syncState={status:"off",at:Date.now(),msg:"Hors ligne : synchro différée"}; }
  renderSyncBadge(); }
function adoptRemote(d){ if(!d||!d.json) return; const remote=JSON.parse(d.json); const server=S.server; S=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),remote,{server}); S.updatedAt=d.updatedAt||S.updatedAt; try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
async function pullState(){ if(!syncReady()) return; try{ const r=await apiFetch("/api/state"); if(r.status===401){ syncState={status:"err",at:Date.now(),msg:"Clé refusée"}; renderSyncBadge(); return; } if(!r.ok) throw 0; const d=await r.json();
    if(d.json&&d.updatedAt>(S.updatedAt||0)){ adoptRemote(d); render(); toast("Données récupérées depuis ton compte"); } else if((S.updatedAt||0)>(d.updatedAt||0)) await pushState();
    syncState={status:"ok",at:Date.now(),msg:""}; }catch(e){ syncState={status:"off",at:Date.now(),msg:"Serveur injoignable"}; } renderSyncBadge(); }
function renderSyncBadge(){ const el=document.getElementById("syncBadge"); if(!el) return; const t={local:"Sur ce téléphone",sync:"Synchronisation…",ok:"Synchronisé",err:"Erreur : "+syncState.msg,off:syncState.msg}[syncState.status]; el.textContent=t; el.className="tiny "+(syncState.status==="err"?"stop":"muted"); }
window.addEventListener("online",()=>{ if(syncReady()) pushState(); });

/* ---------- seeds & migration ---------- */
function seed(){
  if(!S.events.length){
    S.events=[
      {id:"ev-mudgirl",name:"MUDGIRL Lyon",type:"ocr",date:"2026-10-17",time:"",distanceKm:null,place:"Grand Parc Miribel-Jonage",priority:"participation",goal:"Prendre du plaisir, finir entière",status:"prévu"},
      {id:"ev-lausanne",name:"10 km de Lausanne",type:"course",date:"2026-10-25",time:"14:00",distanceKm:10,place:"Lausanne",priority:"repère",goal:"Premier repère chrono sur 10 km",status:"prévu"},
      {id:"ev-athenes",name:"10 km d'Athènes",type:"course",date:"2026-11-08",time:"08:00",distanceKm:10,place:"Athènes · Athens Marathon The Authentic, 10 km Road Race",priority:"repère",goal:"Deuxième repère, comparé à Lausanne",status:"prévu"}
    ];

function comparable(a,b){ const ga=(a.elevM||0)/a.distanceKm, gb=(b.elevM||0)/b.distanceKm; return Math.abs(ga-gb)<=5&&Math.abs(a.distanceKm-b.distanceKm)<=0.2*Math.max(a.distanceKm,b.distanceKm)&&(a.kind||"facile")===(b.kind||"facile"); }

function barChart(labels,vals,unit){ const W=340,H=150,pl=30,pb=22,pt=10; const mx=Math.max(...vals,1); const bw=(W-pl-10)/vals.length; let s=`<svg viewBox="0 0 ${W} ${H}">`; vals.forEach((v,i)=>{ const hgt=(H-pt-pb)*v/mx; s+=`<rect x="${pl+i*bw+3}" y="${H-pb-hgt}" width="${bw-6}" height="${hgt}" rx="3" fill="var(--accent)"/><text x="${pl+i*bw+bw/2}" y="${H-pb-hgt-4}" font-size="10" text-anchor="middle" fill="var(--ink-2)">${v}</text><text x="${pl+i*bw+bw/2}" y="${H-6}" font-size="10" text-anchor="middle" fill="var(--ink-2)">${labels[i]}</text>`; }); s+=`<text x="4" y="${pt+8}" font-size="10" fill="var(--ink-2)">${unit}</text></svg>`; return s; }

  const d=$("#ad").value||sheetArg; const t=sheetDraft.type; const title={crossfit:"CrossFit",hyrox:"Cours HYROX","hyrox-simu":"Simulation HYROX",running:"Running",renfo:"Renforcement",marche:"Marche",autre:"Activité"}[t];
  const comp=$("#acomp").checked||t==="marche";
  const obj={date:d,type:t,title,durationMin:num($("#adur").value),distanceKm:num($("#akm").value),elevM:num($("#ael").value),avgHr:num($("#ahr").value),effort:sheetDraft.effort,notes:$("#an").value,complementary:comp,matched:comp?null:d,source:"manuel",kind:"facile"};
  if(sheetEdit){ const ex=S.activities.find(x=>x.id===sheetEdit); Object.assign(ex,obj); } else S.activities.push({id:uid(),...obj});
  sheetEdit=null; sheetPreset=null; save(); toast("Activité enregistrée"); closeSheet();
}

function sheetMeasure(){
  const m=sheetArg?S.measurements.find(x=>x.id===sheetArg):null; const o=m||{date:today()};
  let h=head(m?"Modifier la pesée":"Nouvelle pesée","Le poids suffit ; le reste est facultatif.");
  h+=`<div class="field" style="margin-top:16px"><label for="md">Date</label><input class="input" id="md" type="date" value="${o.date}"></div>
  <div class="field"><label for="mw">Poids (kg) *</label><input class="input hero-m" style="font-size:40px;min-height:64px" id="mw" inputmode="decimal" value="${o.weight??""}" placeholder="67,3"></div>
  <details><summary>Composition et mensurations</summary><div class="grid2" style="margin-top:10px"><div class="field"><label for="mf">Masse grasse (%)</label><input class="input" id="mf" inputmode="decimal" value="${o.fatPct??""}"></div><div class="field"><label for="mfk">Masse grasse (kg)</label><input class="input" id="mfk" inputmode="decimal" value="${o.fatKg??""}"></div><div class="field"><label for="mm">Masse musculaire (kg)</label><input class="input" id="mm" inputmode="decimal" value="${o.muscleKg??""}"></div><div class="field"><label for="mwa">Tour de taille (cm)</label><input class="input" id="mwa" inputmode="decimal" value="${o.waist??""}"></div><div class="field"><label for="mhi">Tour de hanches (cm)</label><input class="input" id="mhi" inputmode="decimal" value="${o.hips??""}"></div><div class="field"><label for="mar">Tour de bras (cm)</label><input class="input" id="mar" inputmode="decimal" value="${o.arm??""}"></div></div></details>
  <details><summary>Note et photo</summary><div class="field" style="margin-top:10px"><input class="input" id="mn" value="${esc(o.note||"")}" placeholder="cycle, sommeil, contexte"></div><div class="field"><label for="mp">Photo de progression</label><input id="mp" type="file" accept="image/*" capture="environment"></div>${o.photo?`<img src="${o.photo}" alt="" style="max-width:100%;border-radius:8px">`:""}</details>
  <button class="btn primary block" style="margin-top:16px" id="saveMeasure">Enregistrer</button>${m?'<button class="btn block danger" id="delMeasure" style="margin-top:8px">Supprimer</button>':""}`;
  return h;
}
async function saveMeasure(){
  const w=num($("#mw").value); if(!w){ toast("Le poids est obligatoire"); return; }
  const o={date:$("#md").value||today(),weight:w,fatPct:num($("#mf").value),fatKg:num($("#mfk").value),muscleKg:num($("#mm").value),waist:num($("#mwa").value),hips:num($("#mhi").value),arm:num($("#mar").value),note:$("#mn").value};
  const f=$("#mp").files&&$("#mp").files[0]; if(f) o.photo=await shrink(f);
  if(sheetArg){ Object.assign(S.measurements.find(x=>x.id===sheetArg),o); } else S.measurements.push({id:uid(),...o});
  save(); toast("Pesée enregistrée"); closeSheet();
}
function shrink(file){ return new Promise(res=>{ const img=new Image(); img.onload=()=>{ const c=document.createElement("canvas"); const k=Math.min(1,600/Math.max(img.width,img.height)); c.width=img.width*k; c.height=img.height*k; c.getContext("2d").drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",.75)); }; img.src=URL.createObjectURL(file); }); }

function sheetEvent(){
  const e=sheetArg?S.events.find(x=>x.id===sheetArg):null; const o=e||{type:"course",date:today(),priority:"repère",status:"prévu"};
  let h=head(e?e.name:"Nouvel événement",e?fmtD(e.date):"Course, compétition, événement");
  if(e){ const p=adapted(e.date); h+=`<div class="card" style="margin-top:12px"><span class="tag">${esc(e.type)}</span> <span class="tag">${esc(e.priority)}</span><p style="margin:10px 0 4px">${esc(e.goal||"")}</p><p class="muted small" style="margin:0">${esc(e.place||"")}${e.time?" · départ "+e.time:""}${e.distanceKm?" · "+e.distanceKm+" km":""}</p>${e.result?`<p style="margin:10px 0 0"><b>${clock(e.result.time)}</b>${e.distanceKm?" · "+mmss(e.result.time/e.distanceKm)+"/km":""}${e.result.elevM?" · "+e.result.elevM+" m D+":""}${e.result.effort?" · effort "+e.result.effort+"/10":""}</p>`:""}<button class="btn primary block" style="margin-top:12px" data-sheet="result" data-arg="${e.id}">${e.result?"Modifier le résultat":"Saisir mon résultat"}</button></div><details><summary>Modifier l'événement</summary>`; }
  h+=`<div class="field" style="margin-top:12px"><label for="en">Nom</label><input class="input" id="en" value="${esc(o.name||"")}"></div>
  <div class="field"><div class="lab">Type</div><div class="choices">${[["course","Course"],["ocr","Obstacles"],["hyrox-compet","HYROX compétition"],["autre","Autre"]].map(([v,l])=>`<button data-et="${v}" aria-pressed="${o.type===v}">${l}</button>`).join("")}</div></div>
  <div class="grid2"><div class="field"><label for="ed">Date</label><input class="input" id="ed" type="date" value="${o.date}"></div><div class="field"><label for="eti">Heure</label><input class="input" id="eti" type="time" value="${o.time||""}"></div></div>
  <div class="grid2"><div class="field"><label for="ek">Distance (km)</label><input class="input" id="ek" inputmode="decimal" value="${o.distanceKm??""}"></div><div class="field"><label for="ep">Lieu</label><input class="input" id="ep" value="${esc(o.place||"")}"></div></div>
  <div class="field"><div class="lab">Priorité</div><div class="choices">${[["participation","Participation"],["repère","Repère"],["objectif","Objectif"]].map(([v,l])=>`<button data-epr="${v}" aria-pressed="${o.priority===v}">${l}</button>`).join("")}</div></div>
  <div class="field"><label for="eg">Objectif</label><input class="input" id="eg" value="${esc(o.goal||"")}"></div>
  <div class="field"><div class="lab">Statut</div><div class="choices">${[["prévu","Prévu"],["fait","Fait"],["annulé","Annulé"]].map(([v,l])=>`<button data-est="${v}" aria-pressed="${o.status===v}">${l}</button>`).join("")}</div></div>
  <button class="btn primary block" id="saveEvent">${e?"Enregistrer":"Ajouter"}</button>${e?"</details>":""}`;
  sheetDraft={type:o.type,priority:o.priority,status:o.status};
  return h;
}
function saveEvent(){
  const o={name:$("#en").value.trim(),type:sheetDraft.type,date:$("#ed").value,time:$("#eti").value,distanceKm:num($("#ek").value),place:$("#ep").value,priority:sheetDraft.priority,goal:$("#eg").value,status:sheetDraft.status};
  if(!o.name||!o.date){ toast("Nom et date obligatoires"); return; }
  if(sheetArg) Object.assign(S.events.find(x=>x.id===sheetArg),o); else S.events.push({id:uid(),...o});
  save(); toast("Événement enregistré"); closeSheet();
}
function sheetResult(){
  const e=S.events.find(x=>x.id===sheetArg), r=e.result||{};
  let h=head("Résultat · "+e.name,fmtD(e.date));
  h+=`<div class="field" style="margin-top:16px"><label for="rt">Temps officiel (h:mm:ss ou mm:ss)</label><input class="input hero-m" style="font-size:32px;min-height:60px" id="rt" value="${r.time?clock(r.time):""}" placeholder="59:30"></div>
  <div class="grid2"><div class="field"><label for="rel">Dénivelé (m D+)</label><input class="input" id="rel" inputmode="numeric" value="${r.elevM??""}"></div><div class="field"><label for="rhr">FC moyenne</label><input class="input" id="rhr" inputmode="numeric" value="${r.avgHr??""}"></div></div>
  <div class="field"><div class="lab">Effort ressenti</div><div class="choices n11">${Array.from({length:10},(_,i)=>`<button data-reff="${i+1}" aria-pressed="${r.effort==i+1}">${i+1}</button>`).join("")}</div></div>
  <div class="field"><label for="rn">Conditions, ressenti</label><input class="input" id="rn" value="${esc(r.notes||"")}" placeholder="météo, parcours, départ, ce qui a marché"></div>
  <button class="btn primary block" id="saveResult">Enregistrer</button>`;
  sheetDraft={effort:r.effort}; return h;
}
function saveResult(){
  const e=S.events.find(x=>x.id===sheetArg); const t=parseTime($("#rt").value); if(!t){ toast("Temps invalide"); return; }
  e.result={time:t,elevM:num($("#rel").value),avgHr:num($("#rhr").value),effort:sheetDraft.effort,notes:$("#rn").value}; e.status="fait";
  if(e.type==="course"&&e.distanceKm){ let act=S.activities.find(a=>a.eventId===e.id); if(!act){ act={id:uid(),eventId:e.id,source:"manuel"}; S.activities.push(act); } Object.assign(act,{date:e.date,type:"course",title:e.name,durationMin:t/60,distanceKm:e.distanceKm,elevM:e.result.elevM,avgHr:e.result.avgHr,effort:e.result.effort,matched:e.date,complementary:false,kind:"test"});
    if(e.distanceKm===10){ const best=S.events.filter(x=>x.result&&x.distanceKm===10).map(x=>x.result.time); S.user.ref.k10=Math.min(...best); } }
  save(); toast("Résultat enregistré"); closeSheet();
}

/* ---- render & events ---- */
function render(){
  const app=$("#app");
  app.innerHTML = tab==="today"?renderToday():tab==="program"?renderProgram():tab==="progress"?renderProgress():renderProfile();
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
}
function setPref(path,val){ const p=path.split("."); let o=S.user; for(let i=0;i<p.length-1;i++) o=o[p[i]]; o[p[p.length-1]]=val; save(); }
document.addEventListener("click",e=>{
  const t=e.target.closest("button, .card[data-view], .item[data-open]"); if(!t) return;
  if(t.dataset.tab){ tab=t.dataset.tab; view=null; render(); window.scrollTo(0,0); return; }
  if(t.dataset.view!==undefined){ view=t.dataset.view||null; render(); window.scrollTo(0,0); return; }
  if(t.dataset.week){ weekSel=Math.min(P.weeks,Math.max(1,+t.dataset.week)); render(); return; }
  if(t.dataset.cf){ chartFilter=t.dataset.cf; render(); return; }
  if(t.dataset.sheet){ sheetPreset=t.dataset.preset||null; sheetEdit=null; openSheet(t.dataset.sheet,t.dataset.arg||null); return; }
  if(t.dataset.editAct){ sheetEdit=t.dataset.editAct; openSheet("activity",S.activities.find(x=>x.id===sheetEdit).date); return; }
  if(t.dataset.open){ e.stopPropagation(); if(t.dataset.open==="event") openSheet("event",t.dataset.arg); else openSheet(t.dataset.open,t.dataset.arg); return; }
  if(t.dataset.done!==undefined){ e.stopPropagation(); const d=t.dataset.done; if(doneOn(d)){ S.activities=S.activities.filter(a=>!(a.date===d&&!a.complementary&&a.source==="manuel"&&!a.eventId)); save(); render(); } else { sheetPreset=planFor(d).hyrox?"hyrox":planFor(d).type==="box"?"crossfit":planFor(d).type==="run"?"running":"renfo"; sheetEdit=null; openSheet("activity",d); } return; }
  if(t.dataset.nohyrox){ S.overrides[t.dataset.nohyrox]=Object.assign(S.overrides[t.dataset.nohyrox]||{},{noHyrox:true}); save(); render(); toast("Samedi remplacé par une sortie running"); return; }
  if(t.dataset.yeshyrox){ delete S.overrides[t.dataset.yeshyrox].noHyrox; save(); render(); return; }
  if(t.dataset.skip){ S.overrides[t.dataset.skip]=Object.assign(S.overrides[t.dataset.skip]||{},{level:"rouge"}); save(); render(); toast("Séance passée, rien à rattraper"); return; }
  if(t.id==="closeSheet"||t.id==="closeSheet2"){ if(sheet==="checkin") save(); closeSheet(); return; }
  if(t.dataset.ci){ const c=S.checkins[today()]; const v=isNaN(+t.dataset.v)?t.dataset.v:+t.dataset.v; c[t.dataset.ci]=c[t.dataset.ci]===v?null:v; if(t.dataset.ci==="soreness"&&v!=="fortes") c.soreZone=null; if(t.dataset.ci==="pain"&&v!=="oui"){c.painZone=null;c.painLevel=null;} c.at=Date.now(); save(); renderSheet(); return; }
  if(t.dataset.lv){ const d=sheetArg; S.overrides[d]=Object.assign(S.overrides[d]||{},{level:t.dataset.lv}); save(); renderSheet(); return; }
  if(t.dataset.leg){ S.strength[sheetArg].leg=t.dataset.leg; save(); renderSheet(); return; }
  if(t.dataset.setdone!==undefined){ const id=t.closest(".ex").dataset.ex, j=+t.dataset.setdone, x=S.strength[sheetArg].ex[id]; x.done[j]=!x.done[j]; save(); renderSheet(); return; }
  if(t.id==="finishRenfo"){ const d=sheetArg; if(!S.activities.some(a=>a.date===d&&a.type==="renfo")) S.activities.push({id:uid(),date:d,type:"renfo",title:"Renforcement",source:"manuel",matched:d,complementary:false}); save(); toast("Séance terminée"); closeSheet(); return; }
  if(t.dataset.step!==undefined){ const R=S.runs[sheetArg]; R.steps=R.steps||{}; R.steps[t.dataset.step]=!R.steps[t.dataset.step]; save(); renderSheet(); return; }
  if(t.id==="startLive"){ S.runs[sheetArg].mode="live"; stepIdx=0; renderSheet(); return; }
  if(t.id==="stepNext"){ const run=(adapted(sheetArg).replaced||adapted(sheetArg)).run; if(stepIdx<run.steps.length-1){ stepIdx++; } else { S.runs[sheetArg].mode=null; S.runs[sheetArg].steps=Object.fromEntries(run.steps.map((_,i)=>[i,true])); save(); } renderSheet(); $("#sheet").scrollTop=0; return; }
  if(t.id==="stepPrev"){ stepIdx=Math.max(0,stepIdx-1); renderSheet(); return; }
  if(t.dataset.rpe){ const R=S.runs[sheetArg]; R.rpe=R.rpe===+t.dataset.rpe?null:+t.dataset.rpe; save(); renderSheet(); return; }
  if(t.id==="saveRun"){ saveRunActivity(sheetArg); return; }
  if(t.dataset.at){ sheetDraft.type=t.dataset.at; t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===t)); if(t.dataset.at==="marche") $("#acomp").checked=true; return; }
  if(t.dataset.aeff){ sheetDraft.effort=sheetDraft.effort===+t.dataset.aeff?null:+t.dataset.aeff; t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===t&&sheetDraft.effort!=null)); return; }
  if(t.id==="saveAct"){ saveActivity(); return; }
  if(t.id==="delAct"){ S.activities=S.activities.filter(x=>x.id!==sheetEdit); sheetEdit=null; save(); closeSheet(); return; }
  if(t.id==="saveMeasure"){ saveMeasure(); return; }
  if(t.id==="delMeasure"){ S.measurements=S.measurements.filter(x=>x.id!==sheetArg); save(); closeSheet(); return; }
  if(t.dataset.et||t.dataset.epr||t.dataset.est){ const k=t.dataset.et?"type":t.dataset.epr?"priority":"status"; sheetDraft[k]=t.dataset.et||t.dataset.epr||t.dataset.est; t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===t)); return; }
  if(t.id==="saveEvent"){ saveEvent(); return; }
  if(t.dataset.reff){ sheetDraft.effort=+t.dataset.reff; t.parentElement.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b===t)); return; }
  if(t.id==="saveResult"){ saveResult(); return; }
  if(t.dataset.weighday){ S.user.prefs.weighDay=+t.dataset.weighday; save(); render(); return; }
  if(t.dataset.toggle){ const p=t.dataset.toggle.split("."); S.user[p[0]][p[1]]=!S.user[p[0]][p[1]]; save(); render(); return; }
  if(t.id==="syncNow"){ pullState().then(()=>toast(syncState.status==="ok"?"Synchronisé":"Échec : "+syncState.msg)); return; }
  if(t.id==="syncTest"){ (async()=>{ try{ const r=await fetch(apiBase()+"/api/health"); const d=await r.json(); const k=await apiFetch("/api/state"); toast(d.ok?(k.status===401?"Serveur OK, clé refusée":k.ok?"Serveur et clé OK":"Serveur OK, erreur "+k.status):"Réponse inattendue"); }catch(e){ toast("Serveur injoignable"); } })(); return; }
  if(t.id==="askNotif"){ Notification.requestPermission().then(()=>render()); return; }
  if(t.id==="exportBtn"){ const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="byynd-"+today()+".json"; document.body.appendChild(a); a.click(); a.remove(); return; }
  if(t.id==="importBtn"){ $("#importFile").click(); return; }
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.f){ const id=el.closest(".ex").dataset.ex, x=S.strength[sheetArg].ex[id]; x[el.dataset.f][+el.dataset.j]=el.value.replace(",","."); save(); return; }
  if(el.dataset.run){ const R=S.runs[sheetArg]; R[el.dataset.run]=el.value.replace(",","."); save(); return; }
  if(el.dataset.server){ S.server=S.server||{url:"",key:""}; S.server[el.dataset.server]=el.value.trim(); try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} return; }
  if(el.dataset.pref){ const v=el.dataset.pref==="goals.weightTarget"?num(el.value):el.value; if(v!=null) setPref(el.dataset.pref,v); return; }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.wu!==undefined){ const st=S.strength[sheetArg]; st.warm=st.warm||{}; st.warm[el.dataset.wu]=el.checked; save(); return; }
  if(el.id==="importFile"&&el.files&&el.files[0]){ const fr=new FileReader(); fr.onload=()=>{ try{ const d=JSON.parse(fr.result); if(!d||!d.activities) throw 0; if(!confirm("Remplacer les données de ce téléphone par cette sauvegarde ?")) return; S=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),d); save(); render(); toast("Sauvegarde importée"); }catch(_){ toast("Fichier non reconnu"); } }; fr.readAsText(el.files[0]); el.value=""; }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&sheet) closeSheet(); });
if(location.hash==="#checkin") sheet="checkin"; if(location.hash==="#weigh-in") sheet="measure";
render(); if(sheet){ const s=sheet; sheet=null; openSheet(s,null); }
pullState(); setTimeout(renderSyncBadge,0);
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
