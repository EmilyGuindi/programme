name: Build Android BYYND

on:
  push:
    branches: [main]
    paths: ['mobile/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier le secret
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "::error::Ajoute EXPO_TOKEN dans Settings → Secrets and variables → Actions"; exit 1; fi
      - run: npm ci
      - name: Typecheck et tests du moteur
        run: |
          npx tsc --noEmit
          npx tsx --test src/engine/__tests__/*.test.ts
      - name: Compte Expo
        run: |
          set -o pipefail
          npx --yes eas-cli@latest whoami 2>&1 | tee /tmp/who.log || { echo "::error title=EXPO_TOKEN::$(tail -c 600 /tmp/who.log | tr '\n' ' ')"; exit 1; }
      - name: Lier le projet EAS
        run: |
          set -o pipefail
          npx --yes eas-cli@latest init --non-interactive --force 2>&1 | tee /tmp/init.log || { echo "::error title=eas init::$(tail -c 900 /tmp/init.log | tr '\n' ' ')"; exit 1; }
      - name: Configurer les mises à jour à distance
        run: npx --yes eas-cli@latest update:configure --platform android --non-interactive
      - name: Natif ou JavaScript ?
        id: kind
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then echo "native=true" >> $GITHUB_OUTPUT; exit 0; fi
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- mobile/app.json mobile/package.json mobile/package-lock.json mobile/eas.json 'mobile/assets/images/icon*' 'mobile/assets/images/android-icon*' 'mobile/assets/images/splash*' 'mobile/assets/images/notification*')
          if [ -n "$CHANGED" ]; then echo "native=true" >> $GITHUB_OUTPUT; echo "::notice title=Nouvel APK nécessaire::$CHANGED"; else echo "native=false" >> $GITHUB_OUTPUT; fi
      - name: Mise à jour à distance (sans APK)
        if: steps.kind.outputs.native == 'false'
        run: |
          set -o pipefail
          MSG=$(git log -1 --pretty=%s)
          npx --yes eas-cli@latest update --channel preview --platform android --message "$MSG" --non-interactive 2>&1 | tee /tmp/upd.log || { echo "::error title=eas update::$(tail -c 900 /tmp/upd.log | tr '\n' ' ')"; exit 1; }
          echo "::notice title=Mise à jour publiée::$MSG"
      - name: Annuler les anciens builds encore en attente chez Expo
        if: steps.kind.outputs.native == 'true'
        run: |
          for ST in new in-queue in-progress; do
            npx --yes eas-cli@latest build:list --platform android --status $ST --json --non-interactive 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{JSON.parse(s).forEach(b=>console.log(b.id))}catch(e){}})' | while read -r ID; do
              npx --yes eas-cli@latest build:cancel "$ID" --non-interactive && echo "::notice title=Build annulé::$ID"
            done
          done
      - name: Build APK (Expo, plan gratuit) et diagnostic
        if: steps.kind.outputs.native == 'true'
        timeout-minutes: 240
        run: |
          npx --yes eas-cli@latest build --platform android --profile preview --non-interactive --wait --json > /tmp/build.json 2>/tmp/build.err || true
          ID=$(node -e 'try{const a=JSON.parse(require("fs").readFileSync("/tmp/build.json","utf8"));console.log((Array.isArray(a)?a[0]:a).id||"")}catch(e){console.log("")}')
          if [ -z "$ID" ]; then ID=$(npx --yes eas-cli@latest build:list --platform android --limit 1 --json --non-interactive | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{console.log(JSON.parse(s)[0].id)})'); fi
          npx --yes eas-cli@latest build:view "$ID" --json > /tmp/view.json
          node -e '
            const b=JSON.parse(require("fs").readFileSync("/tmp/view.json","utf8")); const fs=require("fs");
            fs.writeFileSync("/tmp/status",b.status||""); fs.writeFileSync("/tmp/apk",(b.artifacts&&(b.artifacts.applicationArchiveUrl||b.artifacts.buildUrl))||"");
            fs.writeFileSync("/tmp/err",b.error?((b.error.errorCode||"")+" — "+(b.error.message||"")):""); fs.writeFileSync("/tmp/logs",(b.logFiles||[]).join("\n"));'
          STATUS=$(cat /tmp/status)
          if [ "$STATUS" = "FINISHED" ]; then curl -sL "$(cat /tmp/apk)" -o "$GITHUB_WORKSPACE/byynd.apk"; echo "::notice title=APK Expo::$(cat /tmp/apk)"; exit 0; fi
          echo "::error title=Erreur EAS::$(cat /tmp/err | tr '\n' ' ' | head -c 1500)"
          : > /tmp/all.log; while read -r u; do [ -n "$u" ] && curl -sL "$u" >> /tmp/all.log; done < /tmp/logs
          grep -iE "error|failed|exception|what went wrong|could not" /tmp/all.log | tail -30 | while read -r l; do echo "::error title=Log::$(echo "$l" | cut -c1-800)"; done
          exit 1
      - name: Publier l'APK (lien fixe)
        if: steps.kind.outputs.native == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./mobile/app.json').expo.version")
          TAG="v$V-${{ github.run_number }}"
          gh release create "$TAG" byynd.apk --title "BYYND $V" --notes "$(git log -1 --pretty=%s)" --latest
          echo "::notice title=APK::https://github.com/${{ github.repository }}/releases/latest/download/byynd.apk"
