name: Build Android BYYND

on:
  push:
    branches: [main]
    paths: ['mobile/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier le secret
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "::error::Ajoute EXPO_TOKEN dans Settings → Secrets and variables → Actions"; exit 1; fi
      - run: npm ci
      - name: Typecheck et tests du moteur
        run: |
          npx tsc --noEmit
          npx tsx --test src/engine/__tests__/*.test.ts
      - name: Compte Expo
        run: |
          set -o pipefail
          npx --yes eas-cli@latest whoami 2>&1 | tee /tmp/who.log || { echo "::error title=EXPO_TOKEN::$(tail -c 600 /tmp/who.log | tr '\n' ' ')"; exit 1; }
      - name: Lier le projet EAS
        run: |
          set -o pipefail
          npx --yes eas-cli@latest init --non-interactive --force 2>&1 | tee /tmp/init.log || { echo "::error title=eas init::$(tail -c 900 /tmp/init.log | tr '\n' ' ')"; exit 1; }
      - name: Configurer les mises à jour à distance
        run: npx --yes eas-cli@latest update:configure --platform android --non-interactive
      - name: Natif ou JavaScript ?
        id: kind
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then echo "native=true" >> $GITHUB_OUTPUT; exit 0; fi
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- mobile/app.json mobile/package.json mobile/package-lock.json mobile/eas.json mobile/assets/images)
          if [ -n "$CHANGED" ]; then echo "native=true" >> $GITHUB_OUTPUT; echo "::notice title=Nouvel APK nécessaire::$CHANGED"; else echo "native=false" >> $GITHUB_OUTPUT; fi
      - name: Mise à jour à distance (sans APK)
        if: steps.kind.outputs.native == 'false'
        run: |
          set -o pipefail
          MSG=$(git log -1 --pretty=%s)
          npx --yes eas-cli@latest update --channel preview --platform android --message "$MSG" --non-interactive 2>&1 | tee /tmp/upd.log || { echo "::error title=eas update::$(tail -c 900 /tmp/upd.log | tr '\n' ' ')"; exit 1; }
          echo "::notice title=Mise à jour publiée::$MSG"
      - name: Java 17
        if: steps.kind.outputs.native == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK sur GitHub (sans file d'attente Expo)
        if: steps.kind.outputs.native == 'true'
        timeout-minutes: 90
        run: |
          set -o pipefail
          npx --yes eas-cli@latest build --platform android --profile preview --local --non-interactive --output "$GITHUB_WORKSPACE/byynd.apk" 2>&1 | tee /tmp/local.log || { grep -iE "error|failed|what went wrong" /tmp/local.log | tail -25 | while read -r l; do echo "::error title=Build::$(echo "$l" | cut -c1-800)"; done; exit 1; }
      - name: Publier l'APK (lien fixe)
        if: steps.kind.outputs.native == 'true'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./mobile/app.json').expo.version")
          TAG="v$V-${{ github.run_number }}"
          gh release create "$TAG" byynd.apk --title "BYYND $V" --notes "$(git log -1 --pretty=%s)" --latest
          echo "::notice title=APK::https://github.com/${{ github.repository }}/releases/latest/download/byynd.apk"
