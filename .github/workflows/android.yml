name: Build Android BYYND

on:
  push:
    branches: [main]
    paths: ['mobile/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier le secret
        run: |
          if [ -z "$EXPO_TOKEN" ]; then echo "::error::Ajoute EXPO_TOKEN dans Settings → Secrets and variables → Actions"; exit 1; fi
      - run: npm ci
      - name: Typecheck et tests du moteur
        run: |
          npx tsc --noEmit
          npx tsx --test src/engine/__tests__/*.test.ts
      - name: Compte Expo
        run: |
          set -o pipefail
          npx --yes eas-cli@latest whoami 2>&1 | tee /tmp/who.log || { echo "::error title=EXPO_TOKEN::$(tail -c 600 /tmp/who.log | tr '\n' ' ')"; exit 1; }
      - name: Lier le projet EAS
        run: |
          set -o pipefail
          npx --yes eas-cli@latest init --non-interactive --force 2>&1 | tee /tmp/init.log || { echo "::error title=eas init::$(tail -c 900 /tmp/init.log | tr '\n' ' ')"; exit 1; }
      - name: Lancer le build APK (plan gratuit)
        run: |
          set -o pipefail
          npx --yes eas-cli@latest build --platform android --profile preview --non-interactive --no-wait 2>&1 | tee /tmp/build.log || { echo "::error title=eas build::$(tail -c 900 /tmp/build.log | tr '\n' ' ')"; exit 1; }
          URL=$(grep -oE 'https://expo.dev/[^ ]+builds/[a-z0-9-]+' /tmp/build.log | head -1)
          echo "::notice title=Build lancé::$URL"
