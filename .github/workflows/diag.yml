name: Diagnostic données
on:
  push:
    branches: [main]
    paths: ['diag/**']
jobs:
  d:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install -g wrangler@4 > /dev/null
      - name: Requêtes
        shell: bash {0}
        run: |
          q(){ R=$(wrangler d1 execute byynd --remote --json --command "$2" 2>&1 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(JSON.stringify(j[0].results))}catch(e){console.log(s.slice(-400))}})'); echo "::notice title=$1::$R"; }
          q "Strava connecté" "SELECT name, json_extract(json,'$.athleteName') AS athlete, json_extract(json,'$.error') AS err, json_extract(json,'$.lastSync') AS lastSync FROM integrations"
          q "Activités Strava" "SELECT count(*) AS total, sum(CASE WHEN json LIKE '%\"caloriesChecked\":true%' THEN 1 ELSE 0 END) AS verifiees, sum(CASE WHEN json_extract(json,'$.calories') > 0 THEN 1 ELSE 0 END) AS avec_kcal FROM strava_activities WHERE deleted=0"
          q "Dernières" "SELECT json_extract(json,'$.date') AS d, json_extract(json,'$.sportType') AS t, json_extract(json,'$.calories') AS kcal, json_extract(json,'$.caloriesChecked') AS ok FROM strava_activities ORDER BY updated_at DESC LIMIT 8"
          q "Etat app" "SELECT updated_at, length(json) AS taille, json_extract(json,'$.strava.since') AS since FROM state"
