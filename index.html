<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Programme Oct → Fév</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14796A">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F0F4; --surface:#FFFFFF; --surface2:#F8F6FA; --ink:#221A2D; --muted:#6C6479; --line:#DFD9E6;
  --p1:#14796A; --p2:#3345A6; --p3:#A86F12; --p4:#A3306A;
  --ok:#2B8550; --warn:#C77D00; --stop:#C13448;
  --pc:var(--p1);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15111B; --surface:#201A28; --surface2:#1A1522; --ink:#EEE9F4; --muted:#A79FB4; --line:#372F43;
    --p1:#3DB8A4; --p2:#7F8EF0; --p3:#E0A646; --p4:#E2659F;
    --ok:#4CC27D; --warn:#E9A23B; --stop:#F06478;
  }
}
:root[data-theme="dark"]{
  --bg:#15111B; --surface:#201A28; --surface2:#1A1522; --ink:#EEE9F4; --muted:#A79FB4; --line:#372F43;
  --p1:#3DB8A4; --p2:#7F8EF0; --p3:#E0A646; --p4:#E2659F;
  --ok:#4CC27D; --warn:#E9A23B; --stop:#F06478;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pc);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 120px}

/* Header */
header{padding:18px 0 10px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.wk{font-family:var(--display);font-weight:800;line-height:.85;font-size:clamp(64px,22vw,104px);letter-spacing:-.02em;color:var(--pc)}
.wk small{font-size:.32em;color:var(--muted);font-weight:700;letter-spacing:0}
.wkmeta{text-align:right;padding-bottom:6px}
.wkmeta .ph{font-family:var(--display);font-size:22px;font-weight:700;color:var(--ink)}
.wkmeta .dt{color:var(--muted);font-size:14px}
.strip{display:grid;grid-template-columns:repeat(20,1fr);gap:3px;margin:14px 0 6px}
.strip button{height:26px;border:0;border-radius:3px;padding:0;opacity:.28;transition:opacity .15s,transform .15s}
.strip button.past{opacity:.55}
.strip button.cur{opacity:1;transform:scaleY(1.25)}
.strip button.sel{opacity:1;box-shadow:inset 0 -4px 0 var(--ink)}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.nav{display:flex;gap:8px;margin-top:12px}
.nav button{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px;font-weight:600}
.sync{font-size:12px;color:var(--muted);margin-top:8px;min-height:16px}

/* Generic */
h2{font-family:var(--display);font-size:28px;font-weight:700;margin:26px 0 10px;line-height:1.05}
h3{font-family:var(--display);font-size:21px;font-weight:700;margin:0 0 6px;line-height:1.1}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.note{border-left:4px solid var(--pc);background:var(--surface);padding:12px 14px;border-radius:4px 12px 12px 4px;margin:10px 0}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg.lv button[data-lv="vert"][aria-pressed="true"]{background:var(--ok);color:#fff}
.seg.lv button[data-lv="orange"][aria-pressed="true"]{background:var(--warn);color:#fff}
.seg.lv button[data-lv="rouge"][aria-pressed="true"]{background:var(--stop);color:#fff}
details{border-top:1px solid var(--line);padding:8px 0 0;margin-top:8px}
summary{font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";color:var(--muted);font-weight:700}
details[open] summary::after{content:"–"}
details>div{padding:6px 0 4px;color:var(--ink)}
ul.clean{margin:4px 0 8px;padding-left:18px}
ul.clean li{margin:3px 0}

/* Days */
.day{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.day .d{font-family:var(--display);font-weight:700;font-size:22px;line-height:1}
.day .d span{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);margin-top:3px}
.day .t{font-weight:600}
.day .s{font-size:14px;color:var(--muted)}
.day.muscu{border-left:5px solid var(--pc)}
.day.box{border-left:5px solid var(--ink)}
.day.open{cursor:pointer}
.day .go{font-size:13px;font-weight:600;color:var(--pc)}
.tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;flex:none}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.tick svg{width:16px;height:16px}

/* Session sheet */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:30;overflow-y:auto;transform:translateY(100%);transition:transform .25s ease;padding-top:env(safe-area-inset-top,0px)}
.sheet.on{transform:none}
.sheet .wrap{padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
.sheethead{position:sticky;top:0;background:var(--bg);z-index:2;padding:14px 0 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.close{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600}
.prog{font-size:14px;color:var(--muted)}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px;margin-bottom:12px}
.ex.done{border-color:var(--ok)}
.exhead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.exhead .n{font-family:var(--display);font-size:15px;color:var(--pc);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.chip{font-size:13px;font-weight:600;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.chip.hot{border-color:var(--pc);color:var(--pc)}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:34px 1fr 1fr 34px;gap:8px;align-items:center}
.set .i{font-size:13px;color:var(--muted);text-align:center}
.set input{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:8px 10px;font-size:16px}
.set .tick{width:34px;height:34px}
.lbls{display:grid;grid-template-columns:34px 1fr 1fr 34px;gap:8px;font-size:12px;color:var(--muted)}
.wu label{display:flex;gap:10px;align-items:center;padding:6px 0}
.wu input{width:20px;height:20px;accent-color:var(--pc)}
.redbox{border:2px solid var(--stop);border-radius:14px;padding:14px;margin:12px 0;background:var(--surface)}

/* Tracking */
.field{margin-bottom:14px}
.field>label,.field>.lab{display:block;font-weight:600;margin-bottom:6px}
.field .hint{font-size:13px;color:var(--muted);font-weight:400}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.scale.s11{grid-template-columns:repeat(11,1fr)}
.scale button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 0;font-weight:600}
.scale button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input.txt,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{min-height:70px;resize:vertical}
.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.daygrid button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0;font-size:13px;font-weight:600;line-height:1.15}
.daygrid button small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.daygrid button[aria-pressed="true"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.daygrid button[aria-pressed="true"] small{color:#fff}
.signal{border-radius:14px;padding:14px 16px;color:#fff;margin:6px 0 10px}
.signal h3{color:#fff}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;font-size:14px;min-width:100%}
th,td{padding:8px 10px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--muted);background:var(--surface2);position:sticky;top:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tr.cur td{background:color-mix(in srgb,var(--pc) 12%,transparent)}
select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;width:100%;font-size:16px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:8px}
.chart svg{width:100%;height:auto;display:block}

/* Plan */
.phase{border-top:6px solid var(--c)}
.phase .when{color:var(--c);font-weight:700}
.kv{display:grid;gap:2px;margin:8px 0}
.kv b{font-weight:600}
.big{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;color:var(--stop)}
.stat{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline;margin:10px 0}
.stat dt{font-family:var(--display);font-weight:700;font-size:22px;text-align:right}
.stat dd{margin:0;color:var(--muted);font-size:15px}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs button{border:0;background:transparent;padding:10px 0 12px;font-weight:600;font-size:14px;color:var(--muted);border-top:3px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-top-color:var(--pc)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.blk{font-family:var(--display);font-weight:700;font-size:15px;color:var(--muted);margin:18px 0 8px}
.paces{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px;margin:8px 0}
.paces b{font-variant-numeric:tabular-nums}
.step{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .tick{margin-top:2px}
.step .pz{display:block;font-size:14px;color:var(--pc);font-weight:600}
.day.run{border-left:5px solid var(--pc);border-left-style:dashed}
.day.opt{opacity:.92}
.tag{display:inline-block;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;color:var(--muted);vertical-align:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <div class="wk" id="wkNum"></div>
      <div class="wkmeta"><div class="ph" id="wkPhase"></div><div class="dt" id="wkDates"></div></div>
    </div>
    <div class="strip" id="strip" aria-label="Semaines du programme"></div>
    <div class="legend"><span>14 oct</span><span>Nov</span><span>Déc</span><span>Jan</span><span>28 fév</span></div>
    <div class="nav"><button id="prev">Semaine précédente</button><button id="next">Semaine suivante</button></div>
    <div class="sync" id="sync"></div>
  </header>
  <main id="main"></main>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Séance"><div class="wrap" id="sheetBody"></div></div>

<nav class="tabs"><div class="in" role="tablist">
  <button role="tab" data-tab="semaine">Semaine</button>
  <button role="tab" data-tab="suivi">Suivi</button>
  <button role="tab" data-tab="progres">Progrès</button>
  <button role="tab" data-tab="plan">Plan</button>
</div></nav>

<script>
/* ========================= Données ========================= */
const START = new Date(2026, 9, 12);
const NW = 20;
const DAYS = [{k:"lun",n:"Lun"},{k:"mar",n:"Mar"},{k:"mer",n:"Mer"},{k:"jeu",n:"Jeu"},{k:"ven",n:"Ven"},{k:"sam",n:"Sam"},{k:"dim",n:"Dim"}];
const DELOAD = [1, 8, 12, 16];
const DEFAULT_K5 = 30*60+30; // 30:30 sur 5 km, estimation de départ

const PHASES = [
  {n:1, name:"Installation", when:"14 oct – 15 nov", weeks:"S1–S5", cvar:"--p1",
   goals:"Récupérer de Gdansk, construire la base aérobie avec du footing facile uniquement, trouver tes charges de référence le dimanche.",
   run:"100 % endurance facile, 35 → 45 min, avec quelques lignes droites. Test 5 km en S5 pour caler tes allures.",
   load:"Double progression le dimanche : haut de la fourchette atteint sur toutes les séries au RIR indiqué → +2,5 kg (hip thrust, RDL) ou +1 kg par haltère. RIR 3 → 2.",
   reduce:"Si le footing facile te demande plus de 4/10 d'effort, ralentis jusqu'à pouvoir parler en phrases complètes. Épaule > 3/10 : adaptations épaule.",
   next:"Travail d'allure à partir de S6 seulement si : 40 min en continu à 4/10 maximum, sans finir épuisée ; récupération du HYROX correcte (≥ 3/5 le lundi) ; test 5 km fait. Sinon, 2 semaines faciles de plus."},
  {n:2, name:"Préserver le muscle", when:"16 nov – 3 jan", weeks:"S6–S12", cvar:"--p2",
   goals:"Garder force et muscle pendant la perte de gras. Introduire le travail au seuil, une semaine sur deux au maximum.",
   run:"Alternance seuil / facile. Pas de fractionné court : le seuil améliore l'allure 10 km à moindre coût de récupération. S8 et S12 faciles.",
   load:"Maintenir les charges, progresser si ça vient. RIR 1–2 sur les exercices principaux. S8 et S12 allégées.",
   reduce:"Volume −1 série partout (même charge) et footings tous faciles si : 2 semaines de suite fatigue ≥ 4/5 ou récupération ≤ 2/5, charges en baisse 2 fois de suite, perte > 0,9 kg/sem.",
   next:"Passage automatique au 4 janvier, avec mesures (poids moyen, tour de taille, photos, charges, test 5 km de S5)."},
  {n:3, name:"Réévaluation", when:"Janvier", weeks:"S13–S16", cvar:"--p3",
   goals:"Décider de la suite selon composition, énergie et performances. Premier travail à allure 5 km si la base tient.",
   run:"Une séance à allure 5 km (S14), le reste facile. Test 5 km en S16.",
   load:"Si énergie et sommeil bons : +1 série élévations latérales, rowing et hip thrust en S14–S15.",
   reduce:"Arbre de décision : charges ou allures en baisse, énergie basse → 2 semaines à maintenance d'abord. Poids moyen ≤ 63 kg et bonne énergie → déficit léger (−300 kcal) ou maintenance. Poids > 64 kg, énergie et charges stables → déficit modéré 4 semaines de plus.",
   next:"S16 bilan : test 5 km le mercredi, tests muscu le dimanche si feu vert (hip thrust 8RM, reps de fentes bulgares à charge fixe), mesures, photos."},
  {n:4, name:"Qualité et force", when:"Février", weeks:"S17–S20", cvar:"--p4",
   goals:"Progresser en force et en allure 10 km, stabiliser le poids à maintenance.",
   run:"Alternance allure 10 km / facile. Test 5 km final en S20 avec estimation de ton temps sur 10 km.",
   load:"Exercices principaux : une première série lourde puis séries à −10 %. Accessoires en double progression.",
   reduce:"Si le poids baisse sans le vouloir ou que la fatigue remonte : ajoute des glucides autour des séances avant de toucher au volume.",
   next:"Bilan S20. Pour viser 5'30/km, le bloc suivant ajoutera un 2e footing facile hebdomadaire."}
];

const NOTES = {
  1:"Reprise après Gdansk. Mercredi : footing très lent, marche autorisée. Dimanche : 2 séries par exercice, RIR 4, technique.",
  2:"Footing facile + lignes droites. Note toutes les charges du dimanche : ce sont tes références.",
  3:"Allonge le footing à 40 min. Toujours en aisance respiratoire.",
  4:"45 min faciles. Si c'est confortable, la base est en place pour le test de S5.",
  5:"Test 5 km mercredi : entre ton temps dans la séance, toutes tes allures se recalculent.",
  6:"Phase 2 : première séance au seuil. Vérifie d'abord les critères de passage dans Plan.",
  7:"Semaine facile en running. Dimanche : la charge prime sur le volume.",
  8:"Semaine allégée : footing facile 35 min, 1 série de moins le dimanche.",
  9:"Seuil, 4 répétitions. Si le HYROX de samedi a été très dur, prends la version facile.",
  10:"Footing facile avec fin un peu plus soutenue. Contrôle de tendance poids : 0,4–0,7 kg/sem.",
  11:"Première séance à allure 10 km. Régulière, pas plus vite que l'allure indiquée.",
  12:"Fêtes : footing facile, dimanche seulement si l'envie est là. Aucune compensation.",
  13:"Phase 3 : mesures et décision cette semaine (arbre de décision dans Plan).",
  14:"Première séance à allure 5 km. Récupère vraiment entre les répétitions.",
  15:"50 min faciles. Dimanche : +1 série élévations, rowing, hip thrust si énergie OK.",
  16:"Semaine bilan : test 5 km mercredi, tests muscu dimanche si tu es au vert.",
  17:"Phase 4 : 2 × 12 min à allure 10 km. Dimanche : séries lourdes puis −10 %.",
  18:"Footing facile. Progresse la série lourde si elle est sortie au bon RIR.",
  19:"4 × 1 km à allure 10 km. Dernière semaine chargée.",
  20:"Test 5 km final : compare à S5 et S16. Bilan complet."
};

/* Running semaine par semaine. pace: easy | seuil | 10k | 5k | null */
const RUNS = {
  1:{k:"facile",t:"Footing très facile",dur:"35 min",steps:[["35 min très facile, marche autorisée","easy"]]},
  2:{k:"facile",t:"Footing facile + lignes droites",dur:"38 min",steps:[["35 min facile","easy"],["4 lignes droites de 15 s, récup 45 s en marchant",null]]},
  3:{k:"facile",t:"Footing facile + lignes droites",dur:"43 min",steps:[["40 min facile","easy"],["4 lignes droites de 15 s, récup 45 s",null]]},
  4:{k:"facile",t:"Footing facile long",dur:"50 min",steps:[["45 min facile","easy"],["6 lignes droites de 15 s, récup 45 s",null]]},
  5:{k:"test",t:"Test 5 km",dur:"40–45 min",steps:[["12 min facile + 3 accélérations de 20 s","easy"],["5 km au chrono, effort maximal régulier, sur parcours plat",null],["5 min de trot ou marche",null]]},
  6:{k:"qualite",t:"Seuil : 3 × 6 min",dur:"45 min",steps:[["15 min facile","easy"],["3 × 6 min allure seuil (7/10), récup 2 min de trot","seuil"],["8 min facile","easy"]]},
  7:{k:"facile",t:"Footing facile + lignes droites",dur:"50 min",steps:[["45 min facile","easy"],["6 lignes droites de 15 s",null]]},
  8:{k:"facile",t:"Footing facile (semaine allégée)",dur:"35 min",steps:[["35 min facile","easy"]]},
  9:{k:"qualite",t:"Seuil : 4 × 6 min",dur:"47 min",steps:[["12 min facile","easy"],["4 × 6 min allure seuil, récup 1 min 30 de trot","seuil"],["6 min facile","easy"]]},
  10:{k:"facile",t:"Footing facile, fin soutenue",dur:"45 min",steps:[["40 min facile","easy"],["5 dernières minutes un peu plus vite (5/10)",null]]},
  11:{k:"qualite",t:"Allure 10 km : 3 × 8 min",dur:"46 min",steps:[["12 min facile","easy"],["3 × 8 min allure 10 km, récup 2 min de trot","10k"],["6 min facile","easy"]]},
  12:{k:"facile",t:"Footing facile (fêtes)",dur:"35–40 min",steps:[["35 à 40 min facile","easy"]]},
  13:{k:"facile",t:"Footing facile + lignes droites",dur:"50 min",steps:[["45 min facile","easy"],["6 lignes droites de 15 s",null]]},
  14:{k:"qualite",t:"Allure 5 km : 6 × 3 min",dur:"48 min",steps:[["12 min facile + 3 accélérations","easy"],["6 × 3 min allure 5 km, récup 2 min de trot","5k"],["8 min facile","easy"]]},
  15:{k:"facile",t:"Footing facile long",dur:"50 min",steps:[["50 min facile","easy"]]},
  16:{k:"test",t:"Test 5 km (bilan)",dur:"40–45 min",steps:[["12 min facile + 3 accélérations","easy"],["5 km au chrono, même parcours qu'en S5",null],["5 min de trot ou marche",null]]},
  17:{k:"qualite",t:"Allure 10 km : 2 × 12 min",dur:"45 min",steps:[["12 min facile","easy"],["2 × 12 min allure 10 km, récup 3 min de trot","10k"],["6 min facile","easy"]]},
  18:{k:"facile",t:"Footing facile + lignes droites",dur:"50 min",steps:[["45 min facile","easy"],["6 lignes droites de 15 s",null]]},
  19:{k:"qualite",t:"Allure 10 km : 4 × 1 km",dur:"48 min",steps:[["12 min facile","easy"],["4 × 1 km allure 10 km, récup 2 min de trot","10k"],["6 min facile","easy"]]},

function W(w){ if(!S.weeks[w]) S.weeks[w]={days:{},sess:{},chk:{},run:{}}; if(!S.weeks[w].run) S.weeks[w].run={}; return S.weeks[w]; }

async function initDb(){

    const id = await user.id(); if (!id) return;
    dbRef = db.doc("data/users/"+id+"/tracker");
    const snap = await dbRef.get();

      const d = snap.data();

const $ = s => document.querySelector(s);

const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
function monday(w){ const d=new Date(START); d.setDate(d.getDate()+7*(w-1)); return d; }
function dayDate(w,i){ const d=monday(w); d.setDate(d.getDate()+i); return d; }
function fmt(d){ return d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"}).replace(".",""); }
function currentWeek(){ const n=Math.floor((Date.now()-START.getTime())/(7*864e5))+1; return Math.min(NW,Math.max(1,n)); }
function phaseOf(w){ return w<=5?1 : w<=12?2 : w<=16?3 : 4; }
function pc(w){ return "var(" + PHASES[phaseOf(w)-1].cvar + ")"; }
function isDeload(w){ return DELOAD.includes(w); }
function addRir(r,k){ if(!k || r==="–") return r; return r.split("–").map(x=>+x+k).join("–"); }
function mmss(sec){ sec=Math.round(sec); return Math.floor(sec/60)+"'"+String(sec%60).padStart(2,"0"); }
function clock(sec){ sec=Math.round(sec); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60; return (h?h+"h"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0"); }
function parseTime(t){ if(!t) return null; const p=String(t).trim().replace(/[h']/g,":").split(":").map(Number); if(p.some(isNaN)) return null; if(p.length===2) return p[0]*60+p[1]; if(p.length===3) return p[0]*3600+p[1]*60+p[2]; return null; }
const k5 = () => S.k5 || DEFAULT_K5;
function paces(){ const p=k5()/5; return {
  easy:[p+75,p+105], seuil:[p+18,p+25], "10k":[p*1.0425-3,p*1.0425+3], "5k":[p-3,p+3], p10:p*1.0425, t10:k5()*2.085 }; }
function paceTxt(z){ const P=paces()[z]; return P ? mmss(P[0])+"–"+mmss(P[1])+" /km" : ""; }
const ZNAME = {easy:"Facile (3–4/10, tu parles en phrases)", seuil:"Seuil (7/10, phrases courtes)", "10k":"Allure 10 km (7–8/10)", "5k":"Allure 5 km (8/10)"};

/* ========================= Planning ========================= */
function runFor(w){
  const r=RUNS[w], lv=W(w).run.level||"vert";
  if (lv==="rouge") return {k:"repos",t:"Repos ou marche",dur:"0–30 min",steps:[["Repos, ou 30 min de marche facile",null]]};
  if (r.k!=="facile" && (lv==="orange" || (S.mode==="light" && r.k==="qualite"))) return {...EASY_SUB, sub:r.t};
  return r;
}
function plan(w){
  const light=S.mode==="light", r=runFor(w);
  return {
    lun:{type:"repos",t:"Repos",s:"Repos complet. Marche possible."},
    mar:{type:"box",t:"CrossFit",s:"Box. Prioritaire." + (w>1?" Option : micro-bloc épaules 8 min après (voir Plan).":"")},
    mer:{type:"run",t:"Running : "+r.t,s:r.dur + (r.sub?" · remplace « "+r.sub+" »":"") + (w===1?" · le programme démarre ici":""),sess:"mer"},
    jeu:{type:"box",t:"CrossFit",s:"Box. Prioritaire."},
    ven:{type:"repos",t:"Repos",s:"Repos complet avant le HYROX."},
    sam:{type:"box",t:"HYROX",s:"Box. Prioritaire."},
    dim:{type:"muscu",opt:true,t:"Renforcement full body",s: light ? "Optionnel. Version courte 25–30 min, si tu es au vert." : "Optionnel, 35–45 min. Fatiguée : tu supprimes, sans rattrapage.",sess:"dim"}
  };
}

/* ========================= Séance du dimanche ========================= */
function legChoice(w){ const s=SES(w,"dim"); if (s.leg) return s.leg; if (s.level==="orange") return "f5"; return w%2 ? "f2" : "f3"; }
function sundayBlocks(w){
  const s=SES(w,"dim"), pi=phaseOf(w)-1, light=S.mode==="light", deload=isDeload(w), orange=s.level==="orange";
  const xr=(deload?1:0)+(orange?1:0);
  const mk=(id)=>{
    const e=EX[id]; let n=e.sets[pi];
    if (w===1) return {id,...e,sets:2,repsTxt:e.reps[0],rirTxt:"4"};
    if (deload) n--; if (orange) n--;
    if (light) n=Math.min(n, e.main?3:2);
    if (w>=14 && w<=15 && ["m4","m3","f1"].includes(id) && !orange && !light) n++;
    return {id,...e,sets:Math.max(1,n),repsTxt:e.reps[pi],rirTxt:addRir(e.rir[pi],xr)};
  };
  const B=[
    {t:"Bloc A, superset : enchaîne A1 puis A2, repos 90 s, répète", items:[mk("f1"),mk("m2")]},
    {t:"Bloc B, superset : B1 puis B2, repos 90 s", items:[mk("m1"),mk("m3")]},
    {t:"Bloc C, superset : C1 puis C2, repos 60 s", items:[mk("m4"),mk("m5")]}
  ];
  if (!light) B.push({t:"Bloc D, jambes (au choix selon ton HYROX)", leg:true, items:[mk(legChoice(w))]});
  B.push({t:"Bloc E, abdos", items:[mk("m7")]});
  if (!light && !orange && w!==1) B.push({t:"Bonus si tu as le temps et l'énergie", items:[mk("m6")]});
  return B;
}
function sundayList(w){ return sundayBlocks(w).flatMap(b=>b.items); }
function countDone(w){ const s=SES(w,"dim"); const list=sundayList(w); let d=0; list.forEach(e=>{const x=s.ex[e.id]; if(x&&x.done&&x.done.slice(0,e.sets).filter(Boolean).length>=e.sets) d++;}); return {d,t:list.length}; }
function lastKg(id,w){
  for (let x=w-1;x>=1;x--){ const v=weekMax(x,id); if(v!=null) return v; } return null;
}
function weekMax(w,id){
  const wk=S.weeks[w]; if(!wk||!wk.sess) return null;
  const vals=[]; ["dim","lun","ven"].forEach(k=>{ const e=wk.sess[k]&&wk.sess[k].ex&&wk.sess[k].ex[id]; if(e&&e.kg) e.kg.forEach(v=>{const n=+v; if(!isNaN(n)&&n>0) vals.push(n);}); });
  return vals.length?Math.max(...vals):null;
}

function signal(w){
  const c=W(w).chk; if(c.fatigue==null&&c.sleepQ==null&&c.recov==null) return null;
  let bad=0; const why=[];
  if(c.fatigue>=4){bad++;why.push("fatigue élevée");}
  if(c.sleepQ<=2||(c.sleepH&&+c.sleepH<6.5)){bad++;why.push("sommeil insuffisant");}
  if(c.recov!=null&&c.recov<=2){bad++;why.push("récupération faible");}
  const rpe=W(w).run.rpe, rk=RUNS[w].k;
  if(rk==="facile"&&rpe>=6){bad++;why.push("footing facile ressenti à "+rpe+"/10");}
  let t,col,msg;
  if(c.shoulder!=null&&c.shoulder>=4){t="Épaule à surveiller";col="var(--stop)";msg="Douleur ≥ 4/10 : adaptations épaule dimanche prochain. Si ça dure plus de 2 semaines ou réveille la nuit, kiné.";}
  else if(bad>=2){t="Semaine suivante allégée";col="var(--stop)";msg="Running 100 % facile, dimanche supprimé, +200 kcal autour des séances. Signaux : "+why.join(", ")+".";}
  else if(bad===1){t="Pas de progression";col="var(--warn)";msg="Mêmes charges dimanche, et la séance d'allure seulement si tu es au vert mercredi. Signal : "+why.join(", ")+".";}
  else {t="Feu vert";col="var(--ok)";msg="Programme normal. Progresse là où tu as atteint le haut des fourchettes.";}
  const prev=S.weeks[w-1]?.chk?.weight, cur=c.weight;
  if(w>1&&prev&&cur){const d=(+prev)-(+cur); if(d>0.9) msg+=" Perte de "+d.toFixed(1)+" kg en une semaine : trop rapide pour garder le muscle, ajoute 150–200 kcal.";}
  return {t,col,msg};
}

function chartSvg(vals,kind){
  const pts=vals.map((v,i)=>v==null?null:[i,v]).filter(Boolean);
  if(!pts.length) return `<p class="muted" style="padding:20px 6px;margin:0">Pas encore de données. Elles apparaîtront ici au fil des semaines.</p>`;
  const lab=v=>kind==="pace"?mmss(v):kind==="clock"?clock(v):Math.round(v*10)/10;
  const W_=320,H=150,pl=40,pr=10,pt=12,pb=24;
  let mn=Math.min(...pts.map(p=>p[1])),mx=Math.max(...pts.map(p=>p[1])); if(mn===mx){mn-=1;mx+=1;} const pad=(mx-mn)*.12; mn-=pad; mx+=pad;
  const inv = kind==="pace"||kind==="clock"; // plus bas = mieux : on inverse l'axe
  const X=i=>pl+(W_-pl-pr)*i/(NW-1), Y=v=>{const f=(v-mn)/(mx-mn); return pt+(H-pt-pb)*(inv?f:1-f);};
  let s=`<svg viewBox="0 0 ${W_} ${H}" role="img" aria-label="Évolution sur 20 semaines">`;
  [[1,5],[6,12],[13,16],[17,20]].forEach(([a,b])=>{ s+=`<rect x="${X(a-1)-3}" y="${H-pb+6}" width="${X(b-1)-X(a-1)+6}" height="4" rx="2" fill="${pc(a)}"/>`; });
  [mn+pad,(mn+mx)/2,mx-pad].forEach(v=>{ s+=`<line x1="${pl}" x2="${W_-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-5}" y="${Y(v)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${lab(v)}</text>`; });
  s+=`<polyline fill="none" stroke="var(--ink)" stroke-width="2" points="${pts.map(p=>X(p[0])+","+Y(p[1])).join(" ")}"/>`;
  pts.forEach(p=>{ s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="${p[0]+1===week?5:3.5}" fill="${pc(p[0]+1)}"/>`; });
  s+=`<text x="${X(0)}" y="${H-2}" font-size="10" fill="var(--muted)">S1</text><text x="${X(NW-1)}" y="${H-2}" font-size="10" text-anchor="end" fill="var(--muted)">S20</text></svg>`;
  return s;
}

  h+=`<h2>Running semaine par semaine</h2><div class="tablewrap"><table><tr><th>Sem.</th><th>Séance</th><th>Durée</th></tr>`+
    Array.from({length:NW},(_,i)=>{const r=RUNS[i+1];return `<tr class="${i+1===week?"cur":""}"><td>S${i+1}</td><td>${esc(r.t)}</td><td>${esc(r.dur)}</td></tr>`;}).join("")+`</table></div>

  <h2>Le dimanche</h2>
  <div class="card"><ul class="clean">
    <li><b>Tous les exercices sont conservés</b>, regroupés en supersets pour tenir en 35–45 min : hip thrust + tirage, landmine + rowing, élévations + face pull, un exercice jambes, abdos, bras en bonus.</li>
    <li><b>Bloc jambes en rotation</b> : fentes bulgares les semaines impaires, RDL les paires. « Fessiers seuls » si le HYROX a chargé les jambes. Goblet squat en option.</li>
    <li><b>Placé après le HYROX</b> parce que lundi est au repos : tu as 48 h avant le CrossFit du mardi.</li>
    <li><b>Optionnel pour de vrai</b> : supprimé, il ne se rattrape pas.</li></ul></div>
  <div class="card"><h3>Micro-bloc épaules, facultatif</h3><p style="margin:0">Une seule séance de muscu par semaine, c'est peu pour les épaules. Sans ajouter de jour : 2 × 15 élévations latérales + 2 × 15 face pull juste après le CrossFit du mardi, 8 minutes. Seulement si tu es au vert.</p></div>

  <h2>Sauvegarde</h2>
  <div class="card"><p>Tes données restent sur ce téléphone. Exporte une sauvegarde de temps en temps : elle te permet de tout récupérer sur un nouveau téléphone.</p>
  <div class="nav" style="margin-top:4px"><button id="exportBtn">Exporter mes données</button><button id="importBtn">Importer une sauvegarde</button></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden></div>

  <h2>Épaule</h2>
  <div class="card"><p>Règle des 3/10 : douleur jusqu'à 3/10 pendant l'effort, pas pire le lendemain matin, c'est acceptable. Au-delà, prends l'alternative indiquée.</p>
  <p style="margin:0">À éviter : tirage menton, dips profonds, développé nuque, extensions triceps au-dessus de la tête. À garder : face pull, rotations externes, rowing.</p></div>`;
  return h;
}

/* ========================= Rendu ========================= */
function renderAll(){
  renderHeader();
  $("#main").innerHTML = tab==="semaine"?renderSemaine() : tab==="suivi"?renderSuivi() : tab==="progres"?renderProgres() : renderPlan();
  if(openSess) (openSess==="dim"?renderSunday:renderRun)();
}
function renderOpen(){ (openSess==="dim"?renderSunday:renderRun)(); }
function setWeek(w){ week=Math.min(NW,Math.max(1,w)); renderAll(); }
function closeSheet(){ openSess=null; $("#sheet").classList.remove("on"); renderAll(); }

document.addEventListener("click", e=>{
  const t=e.target.closest("button, .day.open"); if(!t) return;
  if(t.dataset.week){ setWeek(+t.dataset.week); return; }
  if(t.id==="prev"){ setWeek(week-1); return; }
  if(t.id==="next"){ setWeek(week+1); return; }
  if(t.dataset.tab){ tab=t.dataset.tab; renderAll(); try{window.scrollTo(0,0);}catch(_){} return; }
  if(t.dataset.mode){ S.mode=t.dataset.mode; save(); renderAll(); return; }
  if(t.dataset.day){ e.stopPropagation(); const wk=W(week); wk.days[t.dataset.day]=!wk.days[t.dataset.day]; save(); renderAll(); return; }
  if(t.dataset.chk){ const c=W(week).chk, v=+t.dataset.v; c[t.dataset.chk]=c[t.dataset.chk]===v?null:v; save(); renderAll(); return; }
  if(t.id==="closeSheet"){ closeSheet(); return; }
  if(t.id==="exportBtn"){ const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="programme-sauvegarde-"+new Date().toISOString().slice(0,10)+".json"; document.body.appendChild(a); a.click(); a.remove(); return; }
  if(t.id==="importBtn"){ document.getElementById("importFile").click(); return; }
  if(t.dataset.lv){ if(openSess==="dim") SES(week,"dim").level=t.dataset.lv; else W(week).run.level=t.dataset.lv; save(); renderOpen(); return; }
  if(t.dataset.leg){ SES(week,"dim").leg=t.dataset.leg; save(); renderSunday(); return; }
  if(t.dataset.rpe){ const R=W(week).run, v=+t.dataset.rpe; R.rpe=R.rpe===v?null:v; save(); renderRun(); return; }
  if(t.dataset.step!==undefined){ const R=W(week).run; R.steps=R.steps||{}; R.steps[t.dataset.step]=!R.steps[t.dataset.step]; save(); renderRun(); return; }
  if(t.dataset.setdone!==undefined){ const id=t.closest(".ex").dataset.ex, j=+t.dataset.setdone, x=EXS(week,"dim",id); x.done[j]=!x.done[j]; save(); renderSunday(); return; }
  if(t.classList.contains("day")&&t.dataset.open){ openSess=t.dataset.open; renderOpen(); $("#sheet").classList.add("on"); $("#sheet").scrollTop=0; }
});
document.addEventListener("input", e=>{
  const el=e.target;
  if(el.dataset.f){ const id=el.closest(".ex").dataset.ex, x=EXS(week,"dim",id); x[el.dataset.f][+el.dataset.j]=el.value.replace(",","."); save(); return; }
  if(el.dataset.txt){ W(week).chk[el.dataset.txt]=el.value.replace(/^(\d+),(\d+)$/,"$1.$2"); save(); const sb=$("#signalBox"); if(sb) sb.innerHTML=signalHtml(); return; }
  if(el.dataset.run){ const R=W(week).run; R[el.dataset.run]=el.value.replace(/^(\d+),(\d+)$/,"$1.$2"); 
    if(el.dataset.run==="test"){ const lt=latestTest(); S.k5=lt||S.k5; const o=$("#rtestout"); if(o) o.textContent=testOut(R.test); }
    save(); const rp=$("#rpace"); if(rp){ const p=runPace(week); rp.textContent=p?mmss(p)+" /km":"–"; } return; }
  if(el.dataset.k5){ const s=parseTime(el.value); if(s&&s>=900&&s<=3600){ S.k5=s; save(); } return; }
});
document.addEventListener("change", e=>{
  const el=e.target;
  if(el.dataset.wu!==undefined){ SES(week,"dim").warm[el.dataset.wu]=el.checked; save(); return; }
  if(el.id==="metric"){ metric=el.value; renderAll(); return; }
  if(el.id==="importFile" && el.files && el.files[0]){ const fr=new FileReader(); fr.onload=()=>{ try{ const d=JSON.parse(fr.result); if(!d||typeof d.weeks!=="object") throw 0; if(!confirm("Remplacer les données de ce téléphone par cette sauvegarde ?")) return; S=Object.assign({v:2,mode:"full",k5:null,weeks:{}},d); save(); renderAll(); alert("Sauvegarde importée."); }catch(_){ alert("Fichier non reconnu : choisis un fichier exporté depuis l'app."); } }; fr.readAsText(el.files[0]); el.value=""; return; }
  if(el.dataset.k5){ renderAll(); }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape"&&openSess) closeSheet(); });

renderAll();
initDb();
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
</body>
</html>
